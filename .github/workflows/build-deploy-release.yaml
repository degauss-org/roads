name: build-deploy-release
on:
  release:
    types: [published]
jobs:
  deploy-images:
    runs-on: ubuntu-latest
    env:
      registry: ghcr.io
      username: degauss-org
      repository: roads
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: create latest tag variable
        run: |
          container="$/$/$:latest"
          echo "container=${container}" >> $GITHUB_ENV
      - name: create release tag variable
        if: github.event_name == 'release'
        run: |
          versioned="$/$/$:${GITHUB_REF##*/}"
          echo "versioned=${versioned}" >> $GITHUB_ENV
      - name: build container
        run: |
          docker build -t $ .
      - name: test container
        run: |
          docker run --rm -v "${PWD}/test":/tmp $ my_address_file_geocoded.csv
      - name: login to ghcr
        uses: docker/login-action@v1
        with:
          registry: $
          username: $
          password: $
      - name: deploy release (and latest) container
        run: |
          docker tag $ $
          docker push $
          docker push $